<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF1F4">
<title>恋爱小动物图鉴 · 你是哪只恋爱小动物？</title>
<style>
:root{
  --ink:#3E3040;
  --ink-soft:#7A6A76;
  --pink:#FF8FA3;
  --pink-2:#FFB3C6;
  --pink-soft:#FFE7ED;
  --cream:#FFF8F6;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  color:var(--ink);
  background:var(--cream);
  min-height:100vh;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom);
}
body::before{
  content:"";position:fixed;inset:0;z-index:-2;
  background:
    radial-gradient(60% 40% at 12% 6%, #FFE3EC 0%, rgba(255,227,236,0) 62%),
    radial-gradient(55% 40% at 88% 12%, #E9E0FF 0%, rgba(233,224,255,0) 62%),
    radial-gradient(70% 45% at 50% 100%, #FFEFE2 0%, rgba(255,239,226,0) 62%),
    #FFF8F6;
}
.floaties{position:fixed;inset:0;pointer-events:none;z-index:-1;overflow:hidden;}
.f{position:absolute;font-size:20px;opacity:.5;color:#FFB3C6;animation:floaty 9s ease-in-out infinite;}
.f1{left:7%;top:13%;}
.f2{right:9%;top:19%;font-size:15px;color:#C9B6E4;animation-delay:1.4s;}
.f3{left:14%;top:56%;font-size:14px;color:#FFC9A8;animation-delay:2.6s;}
.f4{right:12%;top:62%;font-size:17px;color:#A9B6E8;animation-delay:.8s;}
.f5{left:46%;top:88%;font-size:13px;color:#FFB3C6;animation-delay:3.2s;}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(0);}50%{transform:translateY(-16px) rotate(10deg);}}

.wrap{max-width:520px;margin:0 auto;padding:22px 18px 46px;position:relative;}

.page{display:none;}
.page.active{display:block;animation:fadeUp .45s cubic-bezier(.22,.8,.35,1) both;}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:none;}}

/* ---------- 通用按钮 ---------- */
.btn{
  border:none;border-radius:999px;font-size:16px;font-weight:700;
  padding:15px 26px;cursor:pointer;font-family:inherit;line-height:1;
  transition:transform .14s ease, box-shadow .22s ease, opacity .2s;
  display:inline-flex;align-items:center;justify-content:center;
}
.btn:active{transform:scale(.965);}
.btn-primary{
  background:linear-gradient(135deg,#FF9DB0,#FF7E96);
  color:#fff;box-shadow:0 12px 26px rgba(255,126,150,.36);
  width:100%;
}
.btn-ghost{
  background:#fff;color:#7A6A76;border:1.6px solid #FFE0E7;width:100%;
  box-shadow:0 4px 14px rgba(255,180,200,.16);
}
.btn-ghost:disabled{opacity:.38;box-shadow:none;}
.btn-text{
  background:none;color:#A08E9C;font-size:14px;padding:10px;width:100%;font-weight:600;
}

/* ---------- 首页 ---------- */
.home-card{
  background:rgba(255,255,255,.8);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  border-radius:34px;
  padding:26px 22px 24px;
  box-shadow:0 22px 60px rgba(255,143,163,.2), 0 1px 0 #fff inset;
  border:1px solid rgba(255,255,255,.95);
  text-align:center;
}
.home-badge{
  display:inline-block;padding:7px 16px;border-radius:999px;
  background:#FFF0F4;color:#FF7E96;font-size:12.5px;font-weight:800;letter-spacing:1.2px;
  margin-bottom:16px;
}
.home-title{
  font-size:29px;line-height:1.35;margin:0 0 12px;font-weight:800;letter-spacing:.5px;
}
.home-title span{
  background:linear-gradient(120deg,#FF7E96,#C9A6F0 70%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.home-sub{
  font-size:14px;line-height:1.75;color:#8A7A88;margin:0 0 6px;font-weight:500;
}
.hero{
  position:relative;height:186px;margin:4px 0 6px;
  display:flex;align-items:center;justify-content:center;
}
.hero-glow{
  position:absolute;width:212px;height:212px;border-radius:50%;
  background:radial-gradient(circle,#FFE1EA 0%,#FFF2F6 55%,rgba(255,255,255,0) 72%);
}
.hero-animal{position:absolute;will-change:transform;}
.hero-animal svg{width:100%;height:100%;display:block;filter:drop-shadow(0 10px 18px rgba(255,143,163,.26));}
.a1{width:82px;height:82px;transform:translate(-80px,12px) rotate(-9deg);animation:sway1 6s ease-in-out infinite;}
.a2{width:114px;height:114px;transform:translate(0,-12px);z-index:2;animation:sway2 6.6s ease-in-out infinite;}
.a3{width:82px;height:82px;transform:translate(80px,12px) rotate(9deg);animation:sway3 6.2s ease-in-out infinite;}
@keyframes sway1{0%,100%{transform:translate(-80px,12px) rotate(-9deg);}50%{transform:translate(-80px,2px) rotate(-4deg);}}
@keyframes sway2{0%,100%{transform:translate(0,-12px);}50%{transform:translate(0,-22px);}}
@keyframes sway3{0%,100%{transform:translate(80px,12px) rotate(9deg);}50%{transform:translate(80px,2px) rotate(4deg);}}
.home-meta{
  display:flex;justify-content:center;gap:10px;margin:6px 0 20px;flex-wrap:wrap;
}
.home-meta span{
  font-size:12.5px;color:#A08E9C;background:#FFF4F7;border-radius:999px;
  padding:7px 14px;font-weight:700;
}
.home-tip{font-size:12.5px;color:#B6A6B2;margin:14px 0 0;line-height:1.7;}

/* ---------- 答题页 ---------- */
.quiz-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.icon-btn{
  width:38px;height:38px;border-radius:50%;border:none;background:#fff;
  color:#B39FAC;font-size:20px;line-height:1;cursor:pointer;
  box-shadow:0 4px 12px rgba(200,160,190,.18);font-family:inherit;
  display:flex;align-items:center;justify-content:center;
  transition:transform .14s;
}
.icon-btn:active{transform:scale(.92);}
.quiz-count{font-size:14px;font-weight:800;color:#B39FAC;letter-spacing:1px;}
.quiz-count b{color:#FF7E96;font-size:17px;}
.progress{height:10px;border-radius:999px;background:#FFE7ED;overflow:hidden;margin-bottom:20px;}
.progress-fill{
  height:100%;width:0;border-radius:999px;
  background:linear-gradient(90deg,#FFC1D0,#FF8FA3);
  transition:width .4s cubic-bezier(.22,.8,.35,1);
}
.q-card{
  background:#fff;border-radius:28px;padding:24px 20px 18px;
  box-shadow:0 16px 44px rgba(210,160,190,.16);
  border:1px solid #FFF1F5;
  margin-bottom:16px;
}
.q-index{
  display:inline-block;font-size:12px;font-weight:800;letter-spacing:2px;
  color:#FF8FA3;background:#FFF1F5;border-radius:999px;padding:5px 12px;margin-bottom:12px;
}
.q-title{font-size:18px;line-height:1.6;margin:0 0 18px;font-weight:800;letter-spacing:.3px;}
.options{display:flex;flex-direction:column;}
.option{
  display:flex;gap:11px;align-items:flex-start;width:100%;
  background:#FFFCFD;border:2px solid #FFEDF2;border-radius:20px;
  padding:15px 16px;margin-bottom:11px;cursor:pointer;
  font-size:15px;line-height:1.55;text-align:left;color:#5A4A56;
  font-family:inherit;font-weight:500;
  transition:all .18s ease;
}
.option:last-child{margin-bottom:0;}
.option:active{transform:scale(.985);}
.option.selected{
  border-color:#FF9DB0;color:#3E3040;font-weight:700;
  background:linear-gradient(135deg,#FFF6F9,#FFEAF1);
  box-shadow:0 8px 22px rgba(255,157,176,.24);
}
.bullet{
  flex:0 0 auto;width:24px;height:24px;border-radius:50%;
  background:#FFF0F4;color:#FF8FA3;font-size:11.5px;font-weight:800;
  display:flex;align-items:center;justify-content:center;margin-top:1px;
  transition:all .18s;
}
.option.selected .bullet{background:#FF8FA3;color:#fff;}
.opt-text{flex:1;}
.quiz-actions{display:flex;gap:12px;}
.quiz-actions .btn{flex:1;}
.quiz-actions .btn-primary{flex:1.6;}

/* ---------- 结果页 ---------- */
#result{--accent:#FFB3C6;--accent-soft:#FFE6ED;}
.result-card{
  background:#fff;border-radius:32px;overflow:hidden;
  box-shadow:0 22px 60px rgba(190,150,180,.2);
  border:1px solid #fff;
}
.result-top{
  position:relative;
  background:linear-gradient(165deg,var(--accent) 0%,var(--accent-soft) 62%,#fff 100%);
  padding:20px 22px 26px;text-align:center;
}
.result-top::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(50% 45% at 50% 8%, rgba(255,255,255,.65) 0%, rgba(255,255,255,0) 70%);
}
.result-animal{
  width:158px;height:158px;margin:0 auto 2px;position:relative;z-index:1;
  filter:drop-shadow(0 12px 22px rgba(120,80,110,.14));
  animation:pop .55s cubic-bezier(.2,1.3,.4,1) both;
}
.result-animal svg{width:100%;height:100%;display:block;}
@keyframes pop{from{opacity:0;transform:scale(.72) translateY(10px);}to{opacity:1;transform:none;}}
.result-badge{
  position:relative;z-index:1;
  display:inline-block;padding:7px 17px;border-radius:999px;
  background:rgba(255,255,255,.82);
  font-size:12.5px;font-weight:800;color:#6B5A66;letter-spacing:.8px;
  margin-bottom:10px;box-shadow:0 4px 12px rgba(160,120,150,.12);
}
.result-name{
  position:relative;z-index:1;
  font-size:23px;margin:0 0 10px;font-weight:800;letter-spacing:.6px;line-height:1.35;
}
.result-slogan{
  position:relative;z-index:1;
  font-size:14.5px;color:#6B5A66;margin:0;line-height:1.7;font-weight:700;
}
.result-main{padding:20px 20px 8px;}
.block{margin-bottom:22px;}
.block-title{
  font-size:13.5px;font-weight:800;color:var(--accent);margin:0 0 9px;letter-spacing:.8px;
}
.block p{font-size:14.5px;line-height:1.85;color:#5F4F5B;margin:0;}
.chips{display:flex;flex-wrap:wrap;gap:8px;}
.chip{
  font-size:13px;font-weight:700;color:#6B5A66;
  background:var(--accent-soft);border-radius:999px;padding:8px 14px;
}
.grid2{display:grid;grid-template-columns:1fr;gap:12px;}
.mini{
  background:#FFFAFC;border:1.5px solid #FFF0F4;border-radius:20px;padding:14px 15px;
}
.mini-title{font-size:13px;font-weight:800;color:#8A7A88;margin-bottom:7px;}
.mini p{font-size:13.8px;line-height:1.8;color:#5F4F5B;margin:0;}
.advice{
  background:linear-gradient(135deg,#FFF7FA,#FFF1F5);
  border-radius:22px;padding:16px 17px;border:1.5px dashed var(--accent);
}
.advice p{font-size:14px;}
.result-actions{display:flex;flex-direction:column;gap:11px;margin-top:20px;}

/* ---------- 弹窗 ---------- */
.modal{
  position:fixed;inset:0;background:rgba(60,40,55,.62);
  display:none;align-items:center;justify-content:center;
  padding:20px;z-index:99;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
}
.modal.show{display:flex;animation:fadeIn .25s ease both;}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
.modal-inner{
  background:#fff;border-radius:26px;padding:16px 16px 18px;
  max-width:340px;width:100%;text-align:center;
  animation:pop .3s cubic-bezier(.2,1.2,.4,1) both;
}
.modal-inner img{width:100%;border-radius:16px;display:block;}
.modal-tip{font-size:13px;color:#8A7A88;margin:12px 0 14px;line-height:1.6;}

/* ---------- Toast ---------- */
#toast{
  position:fixed;left:50%;bottom:52px;transform:translate(-50%,14px);
  background:rgba(62,48,64,.92);color:#fff;font-size:13.5px;font-weight:600;
  padding:12px 20px;border-radius:999px;opacity:0;pointer-events:none;
  transition:all .28s ease;z-index:200;max-width:86vw;text-align:center;line-height:1.5;
}
#toast.show{opacity:1;transform:translate(-50%,0);}

@media (min-width:560px){
  .home-title{font-size:33px;}
  .grid2{grid-template-columns:1fr 1fr;}
  .q-title{font-size:19px;}
}
</style>
</head>
<body>

<div class="floaties" aria-hidden="true">
  <span class="f f1">♡</span>
  <span class="f f2">✦</span>
  <span class="f f3">♡</span>
  <span class="f f4">✧</span>
  <span class="f f5">♡</span>
</div>

<main class="wrap">

  <!-- ============ 首页 ============ -->
  <section class="page active" id="home">
    <div class="home-card">
      <div class="home-badge">恋爱小动物图鉴</div>
      <h1 class="home-title">你是哪只<br><span>恋爱小动物</span>？</h1>
      <p class="home-sub">10 种恋爱人格 × 15 道题<br>3 分钟，测出你在感情里的真实样子</p>

      <div class="hero">
        <div class="hero-glow"></div>
        <div class="hero-animal a1" id="hero-a1"></div>
        <div class="hero-animal a2" id="hero-a2"></div>
        <div class="hero-animal a3" id="hero-a3"></div>
      </div>

      <div class="home-meta">
        <span>15 道题</span>
        <span>约 2 分钟</span>
        <span>10 种结果</span>
      </div>

      <button class="btn btn-primary" id="btn-start">开始测试</button>
      <p class="home-tip">测完可以保存成图片，发给那个让你心动的人</p>
    </div>
  </section>

  <!-- ============ 答题页 ============ -->
  <section class="page" id="quiz">
    <div class="quiz-top">
      <button class="icon-btn" id="btn-home" aria-label="返回首页">‹</button>
      <div class="quiz-count"><b id="cur-num">1</b> / <span id="total-num">15</span></div>
      <div style="width:38px"></div>
    </div>
    <div class="progress"><div class="progress-fill" id="progress-fill"></div></div>

    <div class="q-card">
      <div class="q-index" id="q-index">Q1</div>
      <h2 class="q-title" id="q-title">题目加载中…</h2>
      <div class="options" id="options"></div>
    </div>

    <div class="quiz-actions">
      <button class="btn btn-ghost" id="btn-prev">上一题</button>
      <button class="btn btn-primary" id="btn-next" disabled>下一题</button>
    </div>
  </section>

  <!-- ============ 结果页 ============ -->
  <section class="page" id="result">
    <div class="result-card">
      <div class="result-top">
        <div class="result-animal" id="result-animal"></div>
        <div class="result-badge" id="result-badge">专属标签</div>
        <h1 class="result-name" id="result-name"></h1>
        <p class="result-slogan" id="result-slogan"></p>
      </div>

      <div class="result-main">
        <div class="block">
          <h3 class="block-title">✦ 关于你的恋爱人格</h3>
          <p id="result-desc"></p>
        </div>

        <div class="block">
          <h3 class="block-title">✧ 你的典型表现</h3>
          <div class="chips" id="result-traits"></div>
        </div>

        <div class="grid2" style="margin-bottom:22px;">
          <div class="mini">
            <div class="mini-title">💗 可爱之处</div>
            <p id="result-light"></p>
          </div>
          <div class="mini">
            <div class="mini-title">🌙 小小盲点</div>
            <p id="result-shadow"></p>
          </div>
        </div>

        <div class="block advice">
          <h3 class="block-title">✦ 给你的恋爱建议</h3>
          <p id="result-advice"></p>
        </div>
      </div>
    </div>

    <div class="result-actions">
      <button class="btn btn-primary" id="btn-save">保存结果卡片</button>
      <button class="btn btn-ghost" id="btn-share">分享给朋友</button>
      <button class="btn btn-text" id="btn-retry">重新测一次</button>
    </div>
  </section>

</main>

<!-- 图片预览弹窗 -->
<div class="modal" id="modal">
  <div class="modal-inner">
    <img id="modal-img" alt="结果卡片">
    <p class="modal-tip" id="modal-tip">长按图片，选择「保存图片」即可保存到相册</p>
    <button class="btn btn-primary" id="modal-close">好了</button>
  </div>
</div>

<div id="toast"></div>

<script>
/* ==================================================
   一、视觉素材：内联 SVG 小动物插画
   ================================================== */
const EYES = `
<ellipse cx="79" cy="107" rx="7.5" ry="9.5" fill="#3E3040"/>
<ellipse cx="121" cy="107" rx="7.5" ry="9.5" fill="#3E3040"/>
<circle cx="81.6" cy="103.4" r="2.9" fill="#FFFFFF"/>
<circle cx="123.6" cy="103.4" r="2.9" fill="#FFFFFF"/>`;

const BLUSH = `
<ellipse cx="63" cy="130" rx="13" ry="7.5" fill="#FF8FA3" opacity="0.34"/>
<ellipse cx="137" cy="130" rx="13" ry="7.5" fill="#FF8FA3" opacity="0.34"/>`;

const MOUTH = `<path d="M90 126 q10 12 20 0" stroke="#3E3040" stroke-width="3.6" fill="none" stroke-linecap="round"/>`;

function buildSVG(o){
  return `<svg viewBox="0 0 200 200" width="200" height="200" xmlns="http://www.w3.org/2000/svg">`
    + (o.back || '')
    + `<circle cx="100" cy="112" r="60" fill="${o.main}"/>`
    + (o.extra || '')
    + (o.eyes || EYES)
    + (o.blush || BLUSH)
    + (o.mouth || MOUTH)
    + (o.front || '')
    + `</svg>`;
}

const SVGS = {
  cat: buildSVG({
    main:'#FFB3C6',
    back:`<path d="M52 74 L42 20 L94 52 Z" fill="#FFB3C6"/>
          <path d="M148 74 L158 20 L106 52 Z" fill="#FFB3C6"/>
          <path d="M58 70 L52 34 L88 56 Z" fill="#FFD6E1"/>
          <path d="M142 70 L148 34 L112 56 Z" fill="#FFD6E1"/>`,
    front:`<g stroke="#FF8FA3" stroke-width="3" stroke-linecap="round" opacity=".85">
          <path d="M36 116 L60 120"/><path d="M36 134 L60 131"/>
          <path d="M164 116 L140 120"/><path d="M164 134 L140 131"/></g>`
  }),

  fox: buildSVG({
    main:'#FFAE7E',
    back:`<path d="M50 70 L36 14 L96 48 Z" fill="#FFAE7E"/>
          <path d="M150 70 L164 14 L104 48 Z" fill="#FFAE7E"/>
          <path d="M57 66 L47 30 L88 54 Z" fill="#FFE3D0"/>
          <path d="M143 66 L153 30 L112 54 Z" fill="#FFE3D0"/>`,
    extra:`<ellipse cx="100" cy="139" rx="31" ry="22" fill="#FFF4EC"/>`,
    mouth:`<ellipse cx="100" cy="126" rx="7" ry="5.5" fill="#3E3040"/>
           <path d="M100 132 v6" stroke="#3E3040" stroke-width="3.4" stroke-linecap="round"/>
           <path d="M100 138 q-9 9 -16 1" stroke="#3E3040" stroke-width="3.4" fill="none" stroke-linecap="round"/>
           <path d="M100 138 q9 9 16 1" stroke="#3E3040" stroke-width="3.4" fill="none" stroke-linecap="round"/>`
  }),

  dog: buildSVG({
    main:'#FFCB6B',
    back:`<ellipse cx="46" cy="116" rx="19" ry="36" fill="#E9A93F" transform="rotate(-12 46 116)"/>
          <ellipse cx="154" cy="116" rx="19" ry="36" fill="#E9A93F" transform="rotate(12 154 116)"/>`,
    extra:`<ellipse cx="100" cy="137" rx="27" ry="20" fill="#FFF6E4"/>`,
    mouth:`<ellipse cx="100" cy="124" rx="7.5" ry="6" fill="#3E3040"/>
           <path d="M100 130 v6" stroke="#3E3040" stroke-width="3.4" stroke-linecap="round"/>
           <path d="M100 136 q-9 9 -16 1" stroke="#3E3040" stroke-width="3.4" fill="none" stroke-linecap="round"/>
           <path d="M100 136 q9 9 16 1" stroke="#3E3040" stroke-width="3.4" fill="none" stroke-linecap="round"/>`
  }),

  hedgehog: buildSVG({
    main:'#BFA4E8',
    back:`<g fill="#A98BD8">
            <path d="M62 70 L48 24 L90 54 Z"/>
            <path d="M100 58 L100 10 L126 46 Z"/>
            <path d="M138 70 L152 24 L110 54 Z"/>
          </g>`,
    mouth:`<ellipse cx="100" cy="126" rx="6.5" ry="5" fill="#3E3040"/>
           <path d="M90 136 q10 10 20 0" stroke="#3E3040" stroke-width="3.4" fill="none" stroke-linecap="round"/>`
  }),

  sloth: buildSVG({
    main:'#C9AA85',
    back:`<circle cx="52" cy="84" r="19" fill="#B3926E"/>
          <circle cx="148" cy="84" r="19" fill="#B3926E"/>`,
    extra:`<ellipse cx="79" cy="107" rx="21" ry="17" fill="#8C6B4B" opacity=".45"/>
           <ellipse cx="121" cy="107" rx="21" ry="17" fill="#8C6B4B" opacity=".45"/>`,
    mouth:`<ellipse cx="100" cy="126" rx="8" ry="6" fill="#3E3040"/>
           <path d="M90 138 q10 10 20 0" stroke="#3E3040" stroke-width="3.4" fill="none" stroke-linecap="round"/>`
  }),

  peacock: buildSVG({
    main:'#8FD3E8',
    back:`<g stroke="#5BBFD8" stroke-width="5" stroke-linecap="round" fill="none">
            <path d="M100 58 L100 22"/><path d="M100 60 L76 30"/><path d="M100 60 L124 30"/>

      { t:'人群里他只看着你', s:{peacock:2, wolf:1, cat:1} },
      { t:'他笨拙但特别认真地对你好', s:{dog:2, bee:1, penguin:1} },
      { t:'他偶尔露出「只对你才有的样子」', s:{fox:2, cat:1, hedgehog:1} }
    ]},

  { q:'恋爱中，你最怕自己变成——',
    options:[
      { t:'太黏人，最后失去自己', s:{owl:2, hedgehog:1, sloth:1} },
      { t:'太被动，把对方等丢了', s:{dog:2, bee:1, cat:1} },
      { t:'太用力，反而把人吓跑', s:{wolf:2, bee:1, penguin:1} },
      { t:'太冷静，看起来不够喜欢', s:{sloth:2, fox:1, peacock:1} }
    ]}
];

/* ==================================================
   四、状态与工具
   ================================================== */
const TOTAL = QUESTIONS.length;
const state = { index: 0, answers: new Array(TOTAL).fill(null), result: null };
let navLock = false;

const $ = id => document.getElementById(id);

function toast(msg){
  const el = $('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 2300);
}

function showPage(id){
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  $(id).classList.add('active');
  window.scrollTo(0, 0);
}

/* ==================================================
   五、答题逻辑
   ================================================== */
function renderQuestion(){
  const q = QUESTIONS[state.index];
  $('q-index').textContent = 'Q' + (state.index + 1);
  $('q-title').textContent = q.q;
  $('cur-num').textContent = state.index + 1;
  $('total-num').textContent = TOTAL;
  $('progress-fill').style.width = (((state.index + 1) / TOTAL) * 100) + '%';

  const box = $('options');
  box.innerHTML = '';
  q.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'option' + (state.answers[state.index] === i ? ' selected' : '');
    btn.innerHTML = '<span class="bullet">' + 'ABCD'[i] + '</span><span class="opt-text">' + opt.t + '</span>';
    btn.addEventListener('click', () => selectOption(i));
    box.appendChild(btn);
  });

  const next = $('btn-next');
  next.textContent = state.index === TOTAL - 1 ? '查看结果' : '下一题';
  next.disabled = state.answers[state.index] === null;
  $('btn-prev').disabled = state.index === 0;
  $('btn-prev').style.opacity = state.index === 0 ? '.38' : '1';
}

function selectOption(i){
  state.answers[state.index] = i;
  document.querySelectorAll('#options .option').forEach((el, idx) => {
    el.classList.toggle('selected', idx === i);
  });
  $('btn-next').disabled = false;
  $('btn-next').textContent = state.index === TOTAL - 1 ? '查看结果' : '下一题';
}

/* 计分：累加所有选项分值，平局按固定优先级裁决（可复现） */
function computeResult(){
  const scores = {};
  ORDER.forEach(k => scores[k] = 0);

  state.answers.forEach((ansIdx, qi) => {
    if (ansIdx === null) return;
    const s = QUESTIONS[qi].options[ansIdx].s;
    for (const k in s) {
      if (scores[k] === undefined) scores[k] = 0;
      scores[k] += s[k];
    }
  });

  let best = ORDER[0], bestScore = -1;
  ORDER.forEach(k => {
    if (scores[k] > bestScore) { bestScore = scores[k]; best = k; }
  });
  return best;
}

function finish(){
  if (state.answers.some(a => a === null)) {
    toast('还有题目没有作答哦～');
    return;
  }
  state.result = computeResult();
  renderResult(state.result);
  showPage('result');
}

/* ==================================================
   六、结果渲染
   ================================================== */
function renderResult(key){
  const t = TYPES[key];
  const res = $('result');
  res.style.setProperty('--accent', t.color);
  res.style.setProperty('--accent-soft', t.soft);

  $('result-animal').innerHTML = SVGS[key];
  $('result-badge').textContent = t.tag;
  $('result-name').textContent = t.full;
  $('result-slogan').textContent = t.slogan;
  $('result-desc').textContent = t.desc;
  $('result-light').textContent = t.light;
  $('result-shadow').textContent = t.shadow;
  $('result-advice').textContent = t.advice;
  $('result-traits').innerHTML = t.traits.map(x => '<span class="chip">' + x + '</span>').join('');
}

/* ==================================================
   七、结果卡片绘制
   ================================================== */
const FONT_STACK = '"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif';

function roundRect(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function wrapText(ctx, text, maxW){
  const chars = Array.from(text);
  const lines = [];
  let line = '';
  for (const ch of chars) {
    if (ch === '\n') { if (line) lines.push(line); line = ''; continue; }
    const test = line + ch;
    if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = ch; }
    else line = test;
  }
  if (line) lines.push(line);
  return lines;
}

function fitFont(ctx, text, maxW, size, weight){
  let s = size;
  ctx.font = weight + ' ' + s + 'px ' + FONT_STACK;
  while (ctx.measureText(text).width > maxW && s > 28) {
    s -= 2;
    ctx.font = weight + ' ' + s + 'px ' + FONT_STACK;
  }
  return s;
}

function svgToImage(svg){
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  });
}

async function generateCard(){
  const t = TYPES[state.result];
  const W = 1080, H = 1440;
  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');

  /* 背景 */
  const bg = ctx.createLinearGradient(0, 0, W, H);
  bg.addColorStop(0, t.soft);
  bg.addColorStop(0.55, '#FFFFFF');
  bg.addColorStop(1, t.soft);
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  /* 背景圆点装饰 */
  ctx.globalAlpha = 0.35;
  ctx.fillStyle = t.color;
  [[120,180,10],[960,140,7],[80,1300,8],[1000,1250,11],[540,56,6],
   [120,760,5],[980,820,6],[200,1420,7],[880,1420,5],[70,470,6],[1010,520,8]]
    .forEach(p => { ctx.beginPath(); ctx.arc(p[0], p[1], p[2], 0, Math.PI * 2); ctx.fill(); });
  ctx.globalAlpha = 1;

  /* 主卡片 */
  ctx.save();
  ctx.shadowColor = 'rgba(120,80,110,0.13)';
  ctx.shadowBlur = 60;
  ctx.shadowOffsetY = 20;
  ctx.fillStyle = '#FFFFFF';
  roundRect(ctx, 64, 64, W - 128, H - 128, 64);
  ctx.fill();
  ctx.restore();

  /* 顶部色块 */
  ctx.save();
  roundRect(ctx, 64, 64, W - 128, 600, 64);
  ctx.clip();
  const g2 = ctx.createLinearGradient(64, 64, W - 64, 664);
  g2.addColorStop(0, t.color);
  g2.addColorStop(1, t.soft);
  ctx.fillStyle = g2;
  ctx.fillRect(64, 64, W - 128, 600);
  ctx.restore();

  /* 插画 */
  try {
    const img = await svgToImage(SVGS[t.key]);
    ctx.drawImage(img, 310, 120, 460, 460);
  } catch (e) {
    /* 插画加载失败时不影响文字卡片 */
  }

  /* 结果名称 */
  const nameSize = fitFont(ctx, t.full, 860, 72, '700');
  ctx.font = '700 ' + nameSize + 'px ' + FONT_STACK;
  ctx.fillStyle = '#3E3040';
  ctx.textAlign = 'center';
  ctx.fillText(t.full, W / 2, 762);

  /* 标签胶囊 */
  ctx.font = '700 30px ' + FONT_STACK;
  const tagW = ctx.measureText(t.tag).width + 68;
  roundRect(ctx, W / 2 - tagW / 2, 800, tagW, 62, 31);
  ctx.fillStyle = t.soft;
  ctx.fill();
  ctx.fillStyle = '#7A6A76';
  ctx.textBaseline = 'middle';
  ctx.fillText(t.tag, W / 2, 833);
  ctx.textBaseline = 'alphabetic';

  /* 代表文案 */
  ctx.font = '600 40px ' + FONT_STACK;
  ctx.fillStyle = '#5A4A56';
  const lines = wrapText(ctx, t.slogan, 800);
  lines.forEach((ln, i) => ctx.fillText(ln, W / 2, 960 + i * 60));

  /* 分隔线 */
  ctx.strokeStyle = t.color;
  ctx.globalAlpha = 0.5;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(W / 2 - 110, 1128);
  ctx.lineTo(W / 2 + 110, 1128);
  ctx.stroke();
  ctx.globalAlpha = 1;

  /* 分享短文案 */
  ctx.font = '600 32px ' + FONT_STACK;
  ctx.fillStyle = '#7A6A76';
  const sl = wrapText(ctx, t.share, 780);
  sl.slice(0, 2).forEach((ln, i) => ctx.fillText(ln, W / 2, 1198 + i * 50));

  /* 页脚 */
  ctx.font = '500 26px ' + FONT_STACK;
  ctx.fillStyle = '#BCAEB8';
  ctx.fillText('恋爱小动物图鉴 · 你是哪只恋爱小动物？', W / 2, 1310);

  return canvas;
}

const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
  (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

function showModal(src, tip){
  $('modal-img').src = src;
  $('modal-tip').textContent = tip || '长按图片，选择「保存图片」即可保存到相册';
  $('modal').classList.add('show');
}

async function saveCard(){
  const btn = $('btn-save');
  btn.disabled = true;
  btn.textContent = '正在生成…';
  try {
    const canvas = await generateCard();
    const dataUrl = canvas.toDataURL('image/png');

    if (isIOS) {
      showModal(dataUrl, '长按上面的图片，选择「存储到照片」即可保存');
      return;
    }

    canvas.toBlob(blob => {
      if (!blob) {
        showModal(dataUrl, '长按图片即可保存到本地');
        return;
      }
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = '恋爱小动物_' + TYPES[state.result].name + '.png';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 5000);
      toast('卡片已保存到下载文件夹');
    }, 'image/png');
  } catch (e) {
    console.error(e);
    toast('生成失败，可以直接截图保存～');
  } finally {
    btn.disabled = false;
    btn.textContent = '保存结果卡片';
  }
}

/* ==================================================
   八、分享
   ================================================== */
async function copyText(str){
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(str);
      return true;
    }
  } catch (e) { /* 继续走降级方案 */ }

  try {
    const ta = document.createElement('textarea');
    ta.value = str;
    ta.style.position = 'fixed';
    ta.style.top = '-1000px';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    const ok = document.execCommand('copy');
    ta.remove();
    return ok;
  } catch (e) {
    return false;
  }
}

async function shareResult(){
  const t = TYPES[state.result];
  const url = location.href.split('#')[0];
  const text = '我的恋爱人格是「' + t.full + '」\n' + t.slogan + '\n' + t.share;

  if (navigator.share) {
    try {
      await navigator.share({ title: '恋爱小动物图鉴', text: text, url: url });
      return;
    } catch (e) {
      if (e && e.name === 'AbortError') return;
      /* 其他错误继续降级 */
    }
  }

  const ok = await copyText(text + '\n' + url);
  if (ok) {
    toast('文案和链接已复制，去粘贴给朋友吧～');
  } else {
    toast('复制失败，请手动复制浏览器地址栏链接');
  }
}

/* ==================================================
   九、事件绑定与初始化
   ================================================== */
$('hero-a1').innerHTML = SVGS.cat;
$('hero-a2').innerHTML = SVGS.fox;
$('hero-a3').innerHTML = SVGS.dog;

$('btn-start').addEventListener('click', () => {
  state.index = 0;
  state.answers = new Array(TOTAL).fill(null);
  state.result = null;
  renderQuestion();
  showPage('quiz');
});

$('btn-home').addEventListener('click', () => showPage('home'));
$('btn-prev').addEventListener('click', () => {
  if (state.index === 0) return;
  state.index--;
  renderQuestion();
});

$('btn-next').addEventListener('click', () => {
  if (navLock) return;
  if (state.answers[state.index] === null) return;

  if (state.index === TOTAL - 1) { finish(); return; }

  navLock = true;
  state.index++;
  renderQuestion();
  setTimeout(() => { navLock = false; }, 240);
});

$('btn-retry').addEventListener('click', () => {
  state.index = 0;
  state.answers = new Array(TOTAL).fill(null);
  state.result = null;
  renderQuestion();
  showPage('quiz');
});

$('btn-save').addEventListener('click', saveCard);
$('btn-share').addEventListener('click', shareResult);
$('modal-close').addEventListener('click', () => $('modal').classList.remove('show'));
$('modal').addEventListener('click', e => {
  if (e.target === $('modal')) $('modal').classList.remove('show');
});

/* 键盘支持（桌面端） */
document.addEventListener('keydown', e => {
  if (!$('quiz').classList.contains('active')) return;
  const map = { '1':0, '2':1, '3':2, '4':3 };
  if (e.key in map) selectOption(map[e.key]);
  if (e.key === 'Enter') $('btn-next').click();
});

renderQuestion();
</script>
